# Robolectric ships one Android runtime per API level, and the newest it has is
# 35. Expo SDK 57 compiles against 36, so without this pin every Robolectric
# class refuses to start with "targetSdkVersion=36 > maxSdkVersion=35" — a
# harness limit, not a statement about what the module supports at runtime.
#
# Raise it when Robolectric publishes an API 36 runtime; the shadows used here
# (LocationManager, AlarmManager, NotificationManager) behave the same on 35.
sdk=35
